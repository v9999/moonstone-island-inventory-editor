<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory Editor — Moonstone Island</title>
<style>
:root{--bg:#f6f7f4;--fg:#1d2420;--mut:#5d6a62;--card:#fff;--line:#d5dad5;--acc:#2f6f5e;--accfg:#fff;--warn:#a3401f}
@media(prefers-color-scheme:dark){:root{--bg:#161b19;--fg:#e6ebe7;--mut:#93a39a;--card:#1f2623;--line:#33403a;--acc:#6fc4ab;--accfg:#10201a;--warn:#f0a07f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 4px}p.s{color:var(--mut);margin:0 0 20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
#drop{border:2px dashed var(--line);text-align:center;padding:26px;cursor:pointer}#drop.on{border-color:var(--acc)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:6px 12px;cursor:pointer}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row label{color:var(--mut)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-weight:500;padding:4px 6px}
td{padding:3px 6px;border-top:1px solid var(--line)}td input{width:100%}td.n{width:60px;color:var(--mut)}td.q{width:90px}td.b{width:70px;white-space:nowrap}
#msg{min-height:22px;margin:8px 0}.err{color:var(--warn)}.ok{color:var(--acc)}.hide{display:none}
</style></head><body><main>
<h1>Inventory Editor — Moonstone Island</h1>
<p class="s">Open a .dat save, edit each inventory slot and export a new .dat. Everything runs in your browser; nothing is uploaded.</p>
<div class="box" id="drop" tabindex="0">Drop the save .dat file here or click to choose one<input id="file" type="file" class="hide"></div>
<div id="msg"></div>
<div id="app" class="hide">
<div class="box"><div class="row"><b>Add item</b>
<input id="aid" list="ids" placeholder="ID (e.g. ingotMoonstone)" size="22"><input id="aq" type="number" min="1" value="100" style="width:80px">
<button id="add">Add to first free slot</button></div></div>
<div class="box"><div class="row"><input id="flt" placeholder="Filter by ID" size="20"><label><input type="checkbox" id="emp"> show empty slots (0–99)</label>
<span style="flex:1"></span><button id="bak">Download backup of original</button><button class="p" id="sv">Download edited save</button></div></div>
<div class="box"><table><thead><tr><th>Slot</th><th>Item</th><th>Qty</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
<datalist id="ids"></datalist>
<script>
const PW="Ngb5SWCUyYJfbDyzDZzxS92FXT6s",KNOWN=["?bunnyfish", "?flagflowerCrop", "?grumpkinCrop", "?hotPepperCrop", "?iciclerootCrop", "?moonfish", "?pinwheelflowerCrop", "?pizzafish", "?sisyphish", "?snowmanplantCrop", "?spiritBaneCrop", "?squishCrop", "?stoneFruitCrop", "?sweaterplantCrop", "?tigerfish", "?tinyflowerCrop", "?zaplantCrop", "alchemistsWand", "anyEgg", "applumCrop", "ash", "axe1", "axe2", "axe3", "balloon", "barnUpgrade1", "barnUpgrade2", "beachpeachCrop", "blackpearlCrop", "blobfishM", "boltCrop", "boltSeeds", "bottle", "bridge", "broom", "catTailCrop", "chillyberryCrop", "clay", "cloth", "coal", "coin", "colberryCrop", "concoction", "darkMatter", "dough", "dreamDrop", "electriconeCrop", "engramLodestone", "eyeberryCrop", "fertilizerGrowth", "fibre", "fireball", "fishingRod1", "fishingRod2", "fishingRod3", "flagflowerCrop", "flamerootCrop", "flaxCrop", "flour", "furnace", "fuzzballCrop", "gemBlue", "gemGreen", "gemPurple", "gemYellow", "ghostshroomCrop", "giftplantCrop", "glider", "greenhouseUpgrade1", "greenhouseUpgrade2", "grumpkinCrop", "hammer1", "hammer2", "hammer3", "hoe1", "hoe2", "hoe3", "homeBasement1", "homeBasement2", "homeBasement3", "homeBasement4", "homeGroundFloor1", "homeGroundFloor2", "homeGroundFloor3", "homeSecondFloor1", "homeSecondFloor2", "hotPepperCrop", "hotairfruitCrop", "ingotCopper", "ingotIron", "ingotMoonstone", "ladderplantSeeds", "lightningEel", "lilyPadCrop", "lureBigHook", "lureSwiftHook", "magicMushroomCrop", "mandrakeCrop", "mealSweaterCookies", "medallion", "moonstone", "mossballCrop", "nightShadeCrop", "nimbusPlantCrop", "nimbusPlantSeeds", "noodles", "oldBootM", "oreCopper", "oreIron", "paintBuckets", "pinwheelflowerCrop", "plantHistorian", "planternCrop", "plateStack", "poison", "popsiplantCrop", "potionPoisonCleanse", "rice", "rubyplantCrop", "scythe1", "scythe2", "scythe3", "seaGlass", "sheetCopper", "sheetIron", "sheetMoonstone", "sigilChalk", "snowball", "snowdropflowerCrop", "snowflobesCrop", "snowmanplantCrop", "sparks", "spinefish", "squishCrop", "stall", "stone", "stoneFruitCrop", "stunflowerCrop", "sugar", "talismanCleanse", "talismanMeditate", "talismanStudy", "tinyflowerCrop", "treasureMapCleared", "umbrellashroomCrop", "voidfish", "warpWhistle", "water", "wateringCan1", "wateringCan2", "wateringCan3", "willowispCrop", "wine", "wingfruitCrop", "wood", "yarrowCrop"];
const te=new TextEncoder(),td=new TextDecoder(),$=i=>document.getElementById(i);
let S=null;
$("ids").innerHTML=KNOWN.map(i=>`<option value="${i}">`).join("");
function msg(t,c){const m=$("msg");m.textContent=t;m.className=c||""}
async function key(salt,iter,use){const k=await crypto.subtle.importKey("raw",te.encode(PW.normalize()),"PBKDF2",false,["deriveKey"]);
return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,[use])}
async function dec(buf){if(buf.byteLength<33)throw Error("File is too short to be a save.");const v=new DataView(buf);
if(v.getUint8(0)!==0)throw Error("Unrecognized format (first byte is not 0).");const iter=v.getUint32(29);
const data=await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(buf.slice(17,29))},await key(new Uint8Array(buf.slice(1,17)),iter,"decrypt"),buf.slice(33));return{iter,data}}
async function enc(plain,iter){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await key(salt,iter,"encrypt"),plain);const o=new Uint8Array(33+ct.byteLength);
o.set(salt,1);o.set(iv,17);new DataView(o.buffer).setUint32(29,iter);o.set(new Uint8Array(ct),33);return o}
function dl(bytes,name){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bytes]));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function load(f){try{if(!crypto.subtle)throw Error("Open this file directly in Chrome, Edge or Firefox (a secure context is required).");
const orig=await f.arrayBuffer(),{iter,data}=await dec(orig);const text=td.decode(data);
if(te.encode(text).length!==data.byteLength)throw Error("The content is not plain UTF-8 text; editing was cancelled to avoid corrupting the save.");
const lines=text.split("\n"),d=JSON.parse(lines[0]),invStr=d.data&&d.data.InventoryArray;if(!invStr)throw Error("This save has no InventoryArray (it may not be a game save).");
S={name:f.name,orig,iter,lines,d,invStr,inv:JSON.parse(invStr)};
$("app").classList.remove("hide");render();msg(`Save loaded: ${f.name} (${S.inv.data.length} slots).`,"ok")}
catch(e){S=null;$("app").classList.add("hide");msg("Could not open the file: "+(e.name==="OperationError"?"the password does not match this file.":e.message),"err")}}
function render(){const f=$("flt").value.trim().toLowerCase(),sh=$("emp").checked,rows=[];
S.inv.data.forEach((s,i)=>{const id=s[1][0],used=id!==""&&id!=null;if(!used&&!(sh&&i<100))return;if(f&&!String(id).toLowerCase().includes(f))return;
rows.push(`<tr data-i="${i}"><td class="n">${i}</td><td><input data-k="id" list="ids" value="${esc(id)}"></td><td class="q"><input data-k="q" type="number" min="0" value="${s[0][0]}"></td><td class="b"><button data-k="m" title="Set quantity to 100">100</button> <button data-k="z" title="Empty slot">✕</button></td></tr>`)});
$("tb").innerHTML=rows.join("")||`<tr><td colspan="4">No slots to show.</td></tr>`}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
$("tb").addEventListener("change",e=>{const tr=e.target.closest("tr"),i=+tr.dataset.i,s=S.inv.data[i],k=e.target.dataset.k;
if(k==="id")s[1]=[e.target.value.trim()];if(k==="q")s[0]=[Math.max(0,Math.floor(+e.target.value||0))]});
$("tb").addEventListener("click",e=>{const k=e.target.dataset.k;if(k!=="m"&&k!=="z")return;const i=+e.target.closest("tr").dataset.i,s=S.inv.data[i];
if(k==="m")s[0]=[100];else S.inv.data[i]=[[0],[""],[""]];render()});
$("flt").oninput=$("emp").onchange=()=>S&&render();
$("add").onclick=()=>{const id=$("aid").value.trim(),q=Math.max(1,Math.floor(+$("aq").value||1));if(!id)return msg("Enter the item ID.","err");
const i=S.inv.data.findIndex((s,n)=>n<100&&s[1][0]==="");if(i<0)return msg("No free slot in the inventory (0–99). Empty a slot first.","err");
S.inv.data[i]=[[q],[id],[""]];render();msg(`Added ${q}× ${id} to slot ${i}.`,"ok")};
$("bak").onclick=()=>S&&dl(S.orig,S.name+".bak");
$("sv").onclick=async()=>{try{const nIn=JSON.stringify(S.inv),oldQ=JSON.stringify(S.invStr),l=S.lines.slice();let w="";
if(l[0].split(oldQ).length===2)l[0]=l[0].replace(oldQ,()=>JSON.stringify(nIn));else{S.d.data.InventoryArray=nIn;l[0]=JSON.stringify(S.d);w=" (warning: re-serialized)"}
const out=await enc(te.encode(l.join("\n")),S.iter);dl(out,S.name);msg("Save generated: replace the original file with the downloaded one (keep the backup)."+w,"ok")}catch(e){msg("Error generating the save: "+e.message,"err")}};
const dz=$("drop");dz.onclick=()=>$("file").click();dz.onkeydown=e=>{if(e.key==="Enter")$("file").click()};
$("file").onchange=e=>e.target.files[0]&&load(e.target.files[0]);
dz.ondragover=e=>{e.preventDefault();dz.classList.add("on")};dz.ondragleave=()=>dz.classList.remove("on");
dz.ondrop=e=>{e.preventDefault();dz.classList.remove("on");e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])};
</script></main></body></html>
